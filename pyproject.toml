[project]
name = "freeside-fstools"
version = "1.0.0"
description = "Freeside OS Developer and Builder Tools consolidation"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
fstools = "fstools.cli:main"

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fstools"]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
